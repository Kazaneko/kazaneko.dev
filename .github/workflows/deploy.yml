# Builds the site with Hugo and publishes it to GitHub Pages
# on every push to the main branch.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # also allows running it by hand from the Actions tab

# Minimal permissions: read the repo and publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer one cancels the older one.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.151.0     # same version used locally

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          curl -sSL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Set up GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the site
        # baseURL comes from GitHub: it is the right address both before
        # and after the kazaneko.dev domain is connected.
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
