{{- /* List of posts in "ls -lt" style: permissions, date, file name. */}}
{{- with . }}
<ul class="ls">
  {{- range . }}
  <li><span class="dim perms" aria-hidden="true">-rw-r--r--</span><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time><a href="{{ .RelPermalink }}" title="{{ .Title }}">{{ with .File }}{{ .ContentBaseName }}{{ else }}{{ .Title | urlize }}{{ end }}.md</a></li>
  {{- end }}
</ul>
{{- else }}
<p class="dim">{{ i18n "no_posts" }}</p>
{{- end }}
